name: Release & Publish

# A merged PR that bumps the version in package.json releases it:
#
# 1. build: with read-only contents and no npm token, check, build (the CLI bundle plus the dashboard built from
#    the gtfs-viz submodule at its pinned commit) and npm pack @gabrielahn/gtfs-tools. The .tgz is handed over
#    as an artifact.
# 2. publish: only after build succeeded, tag v<version> on the built commit, create the GitHub release (its
#    notes are the version's CHANGELOG.md section), then
#    npm publish the tarball. It installs nothing and runs no package scripts. A version already on npm is
#    skipped.
#
# A failed build therefore never leaves a GitHub release without its npm package.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.bump.outputs.release }}
    steps:
      - name: Check for a version bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATCHES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select(.filename == "package.json") | .patch')
          if grep -Eq '^\+[[:space:]]*"version":' <<< "$PATCHES"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "#$PR bumps the version — releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "#$PR does not bump the version — skipping release and publish"
          fi

  build:
    needs: version-bump
    if: needs.version-bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The commit that publish tags, with the gtfs-viz submodule the dashboard is built from. No token stays
      # in .git/config while npm ci and yarn run install scripts.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The GitHub release notes are the version's CHANGELOG.md section plus an install line. A version
      # without a section fails here, before anything is built.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node .github/scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/packages/release-notes.md"
          test -s "$RUNNER_TEMP/packages/release-notes.md"
          cat "$RUNNER_TEMP/packages/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # build:cli plus the dashboard: yarn install --frozen-lockfile and yarn build:dashboard in the gtfs-viz
      # submodule (the runner's yarn 1.x), installed into dashboard/.
      - name: Build
        run: npm run build

      - name: Check the dashboard is the build of the pinned gtfs-viz commit
        run: |
          PINNED=$(git rev-parse HEAD:gtfs-viz)
          export PINNED
          node -e '
            const manifest = require("./dashboard/dashboard-manifest.json");
            console.log(JSON.stringify(manifest));
            if (manifest.commit !== process.env.PINNED || manifest.cliApi !== 1) {
              console.error("::error::dashboard/dashboard-manifest.json is not the cliApi 1 build of gtfs-viz " + process.env.PINNED);
              process.exit(1);
            }
          '

      - name: Pack @gabrielahn/gtfs-tools
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --pack-destination "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          ls -l
          tgz="gabrielahn-gtfs-tools-$VERSION.tgz"
          missing=0
          for file in \
            package/dist/index.js \
            package/dashboard/index.html \
            package/dashboard/dashboard-manifest.json \
            package/skills/gtfs-tools/SKILL.md; do
            if ! tar -tzf "$tgz" | grep -qxF "$file"; then
              echo "::error::$tgz has no $file"
              missing=1
            fi
          done
          if tar -tzf "$tgz" | grep -q '^package/gtfs-viz/'; then
            echo "::error::$tgz contains the gtfs-viz submodule"
            missing=1
          fi
          exit "$missing"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/packages/*.tgz
            ${{ runner.temp }}/packages/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/packages

      # An existing tag must point at the commit that was just built, so a retry from a later commit never
      # publishes code that differs from the tag.
      - name: Check if the release exists
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (data.object.sha !== context.sha) {
                core.setFailed(`${tag} points at ${data.object.sha}, not at the built commit ${context.sha}; refusing to publish`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists — skipping`);
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("exists", "false");
            }

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          NOTES: ${{ runner.temp }}/packages/release-notes.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const body = fs.readFileSync(process.env.NOTES, "utf8");
            if (!body.trim()) {
              core.setFailed("release-notes.md is empty");
              return;
            }

            // Create the tag unless a re-run already did (on this same commit; checked above).
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            // The release notes are the version's CHANGELOG.md section, written by the build job.
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body,
              make_latest: "true",
            });
            core.info(`Created release ${tag}`);

      - name: Check if the version is already published
        id: npm_check
        run: |
          PUBLISHED=$(npm view "@gabrielahn/gtfs-tools@${VERSION}" version 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@gabrielahn/gtfs-tools $VERSION already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish @gabrielahn/gtfs-tools $VERSION"
          fi

      # Writes an .npmrc that reads the token from NODE_AUTH_TOKEN, which only the publish step sets.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Publishing a tarball runs no package scripts; it publishes exactly what the build job packed.
      - name: Publish @gabrielahn/gtfs-tools to npm
        if: steps.npm_check.outputs.skip != 'true'
        run: npm publish "$RUNNER_TEMP/packages/gabrielahn-gtfs-tools-$VERSION.tgz" --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
