name: Release & Publish

# A merged PR that bumps the version in package.json (or compat/gtfs-viz-cli/package.json) releases it:
#
# 1. build: with read-only contents and no npm token, check, build (the CLI bundle plus the dashboard built from
#    the gtfs-viz submodule at its pinned commit) and npm pack @gabrielahn/gtfs-tools and the
#    @gabrielahn/gtfs-viz-cli compatibility package. The two .tgz files are handed over as an artifact.
# 2. publish: only after build succeeded, tag v<version> on the built commit, create the GitHub release, then
#    npm publish the gtfs-tools tarball and then the compat tarball. It installs nothing and runs no package
#    scripts. A package whose version is already on npm is skipped.
#
# A failed build therefore never leaves a GitHub release without its npm packages.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.bump.outputs.release }}
    steps:
      - name: Check for a version bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATCHES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select(.filename == "package.json" or .filename == "compat/gtfs-viz-cli/package.json") | .patch')
          if grep -Eq '^\+[[:space:]]*"version":' <<< "$PATCHES"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "#$PR bumps the version — releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "#$PR does not bump the version — skipping release and publish"
          fi

  build:
    needs: version-bump
    if: needs.version-bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The commit that publish tags, with the gtfs-viz submodule the dashboard is built from. No token stays
      # in .git/config while npm ci and yarn run install scripts.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Both packages publish in lockstep. @gabrielahn/gtfs-viz-cli has a stray 2.0.0 on npm, so 2.0.0 is never
      # a lockstep version.
      - name: Check the compatibility package is pinned to the same version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const version = process.env.VERSION;
            const compat = require("./compat/gtfs-viz-cli/package.json");
            const problems = [];
            if (version === "2.0.0") problems.push("2.0.0 is taken by a stray @gabrielahn/gtfs-viz-cli release; pick another version");
            if (compat.version !== version) problems.push(`compat/gtfs-viz-cli is ${compat.version}, not ${version}`);
            if (compat.dependencies?.["@gabrielahn/gtfs-tools"] !== version) problems.push(`compat/gtfs-viz-cli depends on @gabrielahn/gtfs-tools ${compat.dependencies?.["@gabrielahn/gtfs-tools"]}, not ${version}`);
            if (problems.length) { for (const problem of problems) console.error("::error::" + problem); process.exit(1); }
          '

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # build:cli plus the dashboard: yarn install --frozen-lockfile and yarn build:dashboard in the gtfs-viz
      # submodule (the runner's yarn 1.x), installed into dashboard/.
      - name: Build
        run: npm run build

      - name: Check the dashboard is the build of the pinned gtfs-viz commit
        run: |
          PINNED=$(git rev-parse HEAD:gtfs-viz)
          export PINNED
          node -e '
            const manifest = require("./dashboard/dashboard-manifest.json");
            console.log(JSON.stringify(manifest));
            if (manifest.commit !== process.env.PINNED || manifest.cliApi !== 1) {
              console.error("::error::dashboard/dashboard-manifest.json is not the cliApi 1 build of gtfs-viz " + process.env.PINNED);
              process.exit(1);
            }
          '

      # npm pack runs the compatibility package's prepack, which generates its skills/gtfs-viz copy.
      - name: Pack both packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --pack-destination "$RUNNER_TEMP/packages"
          npm pack ./compat/gtfs-viz-cli --pack-destination "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          ls -l
          missing=0
          for entry in \
            "gabrielahn-gtfs-tools-$VERSION.tgz:package/dist/index.js" \
            "gabrielahn-gtfs-tools-$VERSION.tgz:package/dashboard/index.html" \
            "gabrielahn-gtfs-tools-$VERSION.tgz:package/dashboard/dashboard-manifest.json" \
            "gabrielahn-gtfs-tools-$VERSION.tgz:package/skills/gtfs-tools/SKILL.md" \
            "gabrielahn-gtfs-viz-cli-$VERSION.tgz:package/bin/gtfs-viz.js" \
            "gabrielahn-gtfs-viz-cli-$VERSION.tgz:package/skills/gtfs-viz/SKILL.md"; do
            tgz=${entry%%:*}
            file=${entry#*:}
            if ! tar -tzf "$tgz" | grep -qxF "$file"; then
              echo "::error::$tgz has no $file"
              missing=1
            fi
          done
          if tar -tzf "gabrielahn-gtfs-tools-$VERSION.tgz" | grep -q '^package/gtfs-viz/'; then
            echo "::error::gabrielahn-gtfs-tools-$VERSION.tgz contains the gtfs-viz submodule"
            missing=1
          fi
          exit "$missing"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages

      # An existing tag must point at the commit that was just built, so a retry from a later commit never
      # publishes code that differs from the tag.
      - name: Check if the release exists
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (data.object.sha !== context.sha) {
                core.setFailed(`${tag} points at ${data.object.sha}, not at the built commit ${context.sha}; refusing to publish`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists — skipping`);
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("exists", "false");
            }

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const prBody = process.env.PR_BODY;

            // Create the tag unless a re-run already did (on this same commit; checked above).
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            // Create release with PR body or auto-generated notes
            const useAutoNotes = !prBody || prBody.trim().length === 0;
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: useAutoNotes ? undefined : prBody,
              generate_release_notes: useAutoNotes,
              make_latest: "true",
            });
            core.info(`Created release ${tag}`);

      # No npm token here: npm view reads public metadata.
      - name: Check which packages are already published
        id: npm_check
        run: |
          for pair in "tools:@gabrielahn/gtfs-tools" "compat:@gabrielahn/gtfs-viz-cli"; do
            key=${pair%%:*}
            name=${pair#*:}
            PUBLISHED=$(npm view "${name}@${VERSION}" version 2>/dev/null || echo "")
            if [ -n "$PUBLISHED" ]; then
              echo "${key}_skip=true" >> "$GITHUB_OUTPUT"
              echo "$name $VERSION already on npm — skipping publish"
            else
              echo "${key}_skip=false" >> "$GITHUB_OUTPUT"
              echo "Will publish $name $VERSION"
            fi
          done

      # Writes an .npmrc that reads the token from NODE_AUTH_TOKEN, which only the two publish steps set.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Publishing a tarball runs no package scripts; it publishes exactly what the build job packed.
      - name: Publish @gabrielahn/gtfs-tools to npm
        if: steps.npm_check.outputs.tools_skip != 'true'
        run: npm publish "$RUNNER_TEMP/packages/gabrielahn-gtfs-tools-$VERSION.tgz" --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @gabrielahn/gtfs-viz-cli to npm
        if: steps.npm_check.outputs.compat_skip != 'true'
        run: npm publish "$RUNNER_TEMP/packages/gabrielahn-gtfs-viz-cli-$VERSION.tgz" --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
